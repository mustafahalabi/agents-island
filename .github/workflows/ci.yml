name: CI

# This workflow only proves that a push builds and the logic tests pass.
# Releasing is release.yml's job: it runs on merges to main, works out the
# version from the conventional-commit subjects, and signs with secrets a fork
# never sees. scripts/release.sh still cuts a release by hand when needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build app bundle
        run: ./make-app.sh --no-launch

  test:
    name: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Run logic tests
        run: ./scripts/run-tests.sh
