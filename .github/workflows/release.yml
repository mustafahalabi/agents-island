name: Release

# Merging to main cuts the release. scripts/next-version.sh reads the
# conventional-commit subjects since the last tag and answers with a version
# (feat → minor, fix/perf → patch, ! or BREAKING CHANGE → major) or with
# nothing at all, in which case the merge ships no release and this workflow
# stops after a few seconds.
#
# Everything the signing needs — Developer ID certificate, notary credentials,
# Sparkle's private EdDSA key, a token that can push to the Homebrew tap —
# lives in repository secrets and is listed in CONTRIBUTING.md. A fork has none
# of them, which is why this workflow never runs on pull_request.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.8.0). Blank = decide from commits."
        required: false
        type: string
      dry_run:
        description: "Build, sign and notarize, then stop — publish nothing."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Never cut two releases at once: both would compute the same next version off
# the same tag, and the loser would fail after publishing half its artifacts.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    name: decide version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # next-version.sh needs tags and full history

      - id: pick
        name: Work out the next version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "Manual run: releasing $VERSION"
          else
            VERSION=$(./scripts/next-version.sh)
          fi

          DRY="${{ inputs.dry_run }}"

          # A dry run publishes nothing, so it should still be possible when the
          # commits warrant no release — that is exactly when you want to
          # rehearse. Borrow the next patch number purely to have one.
          if [ -z "$VERSION" ] && [ "$DRY" = "true" ]; then
            LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            LAST="${LAST#v}"
            VERSION="${LAST%.*}.$(( ${LAST##*.} + 1 ))"
            echo "Dry run with no release-worthy commits — rehearsing as $VERSION."
          fi

          if [ -z "$VERSION" ]; then
            echo "No release-worthy commits since the last tag — nothing to ship."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag that already exists means this version shipped — re-running
          # would overwrite a published release rather than cut a new one. A dry
          # run never tags, so it is free to reuse the number.
          if [ "$DRY" != "true" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::warning::v$VERSION already exists — skipping."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: release ${{ needs.decide.outputs.version }}
    needs: decide
    if: needs.decide.outputs.version != ''
    runs-on: macos-14
    timeout-minutes: 60    # notarization is the slow part; twice, plus builds
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same suite CI runs. A release is the one place where shipping past
      # a red test is unrecoverable, so it gates rather than runs alongside.
      - name: Run logic tests
        run: ./scripts/run-tests.sh

      # Without this the DMG falls back to a plain hdiutil window instead of the
      # styled drag-to-Applications layout.
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Load signing identity and notary credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          # Throwaway keychain on a throwaway VM, so the password only has to be
          # unguessable for this run.
          KEYCHAIN_PW=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # Without this codesign blocks on a GUI "allow access?" prompt that
          # nobody is there to click, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # release.sh finds the identity via `security find-identity`, which
          # only looks at the search list — an unlisted keychain is invisible.
          security list-keychains -d user -s "$KEYCHAIN" \
              $(security list-keychains -d user | tr -d '"')

          # Store the notary profile in that same keychain, so no password ends
          # up in a command line during the release itself.
          xcrun notarytool store-credentials agents-island \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Stage the Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY is empty — the appcast could not be signed," >&2
            echo "and every existing install would stop receiving updates." >&2
            exit 1
          fi
          KEYFILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          echo "SPARKLE_ED_KEY_FILE=$KEYFILE" >> "$GITHUB_ENV"

      # GITHUB_TOKEN cannot push to another repository, so the cask bump needs
      # its own credential. A deploy key is the narrow choice: it grants write
      # to homebrew-tap and to nothing else, where a personal access token would
      # carry whatever else its owner can reach.
      - name: Authorize the Homebrew tap push
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$HOME/.ssh/tap_key"
          chmod 600 "$HOME/.ssh/tap_key"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          # IdentitiesOnly stops ssh from offering any other key first and
          # getting rejected before it reaches this one.
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Cut the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_REMOTE: git@github.com:mustafahalabi/homebrew-tap.git
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ "$DRY_RUN" = 1 ] && echo "::notice::Dry run — nothing will be published."
          # KEYCHAIN and SPARKLE_ED_KEY_FILE were exported to GITHUB_ENV above.
          NOTARY_KEYCHAIN="$KEYCHAIN" \
            ./scripts/release.sh "${{ needs.decide.outputs.version }}"
